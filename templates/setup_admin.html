
{% extends "base.html" %}
{% block title %}Setup Admin{% endblock %}
{% block heading %}Create Administrator{% endblock %}

{% block content %}
<div class="form-card" style="max-width:450px;margin:50px auto;">
    <h2>Set Up Admin Account</h2>
    <p>Create the first administrator account for StockWise.</p>

    <form method="POST" action="{{ url_for('setup_admin') }}">
        <label>Username</label>
        <input type="text" name="username" required minlength="3"
               placeholder="Create username">

        <label>Password</label>
        <input type="password" name="password" required minlength="8"
               placeholder="Create password">

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required
               placeholder="Re-enter password">

        <button type="submit" class="btn btn-primary"
                style="margin-top:20px;width:100%;">
            Create Admin Account
        </button>
    </form>
</div>
{% endblock %}
